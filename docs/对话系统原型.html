:root {

  background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);

}
.chat-layout {
  display: flex; flex-direction: column; height: 100vh;
  max-width: 1100px; margin: 0 auto; width: 100%;
  background: rgba(255,255,255,0.35);
  border-left: 1px solid var(--line); border-right: 1px solid var(--line);
}

<script>
// ===== 好感度系统 =====
var intimacy = 62;

function getStageName(val) {
  if (val <= 20) return '陌生';
  if (val <= 40) return '认识';
  if (val <= 60) return '熟悉';
  if (val <= 80) return '暧昧';
  return '亲密';
}

function updateIntimacyDisplay() {
  document.getElementById('intimacy-fill').style.width = intimacy + '%';
  document.getElementById('intimacy-val').textContent = intimacy;
  document.getElementById('intimacy-badge').textContent = intimacy;
  var stageName = getStageName(intimacy);
  document.getElementById('intimacy-txt').innerHTML = stageName + ' · ' + intimacy + ' / 100';
}

// 手动调整好感度（用户点击按钮）
function adjustIntimacy(delta) {
  intimacy = Math.max(0, Math.min(100, intimacy + delta));
  updateIntimacyDisplay();
  toast(delta > 0 ? '好感度 +' + delta : '好感度 ' + delta);
}

  var delta = 0;

// ===== 发送消息 =====
function sendMsg() {
  var input = document.getElementById('chat-text');
  var txt = input.value.trim();
  if (!txt) return;
  appendMsg('user', txt);
  input.value = '';
  resetIdleTimer();
  // 动态增减好感度
  adjustIntimacyForMessage(txt);
  // 模拟 AI 回复：打字指示器 + 逐条蹦出
  var typing = document.getElementById('typing');
  typing.style.display = 'flex';
  var box = document.getElementById('chat-box');
  box.scrollTop = box.scrollHeight;
  setTimeout(function () {
    typing.style.display = 'none';
    var replies = pickReply(txt);
    streamReplies(replies);
  }, 900);
}
function onEnter(e) { if (e.key === 'Enter') sendMsg(); }

// ===== 逐条发送（支持撤回）=====

  var shouldRetract = (Math.random() < 0.1 && list.length >= 2);

  if (!shouldRetract) {
    // 正常模式：逐条蹦出
    var i = 0;
    function next() {
      if (i >= list.length) return;
      var delay = (i === 0) ? 0 : (300 + Math.random() * 700);
      setTimeout(function () {
        appendMsg('ai', list[i]);
        box.scrollTop = box.scrollHeight;
        i++;
        next();
      }, delay);
    }
    next();
  } else {
    // 撤回模式：发第一条 → 撤回 → 改口 → 重发 → 继续发剩余
    appendMsg('ai', list[0]);
    box.scrollTop = box.scrollHeight;

    setTimeout(function () {
      appendMsg('sys', '（撤回了一条消息）');
      box.scrollTop = box.scrollHeight;
    }, 800);

    setTimeout(function () {
      appendMsg('ai', retractPool[Math.floor(Math.random() * retractPool.length)]);
      box.scrollTop = box.scrollHeight;
    }, 1400);

    setTimeout(function () {
      appendMsg('ai', list[0]);
      box.scrollTop = box.scrollHeight;

      var i = 1;
      function nextRest() {
        if (i >= list.length) return;
        var delay = 300 + Math.random() * 700;
        setTimeout(function () {
          appendMsg('ai', list[i]);
          box.scrollTop = box.scrollHeight;
          i++;
          nextRest();
        }, delay);
      }
      nextRest();
    }, 2000);
  }
}

// ===== 追加消息 =====
function appendMsg(role, text) {
  var box = document.getElementById('chat-box');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var avatar = role === 'ai' ? '<div class="avatar-sm">🩺</div>' : '';
  div.innerHTML = avatar + '<div class="bubble">' + escapeHtml(text) + '</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== 防冷落：一段时间没互动，TA 主动发消息 =====
var idleTimer = null;
var idleCount = 0;
var IDLE_MS = 25000;

function startIdleTimer() {
  resetIdleTimer();
  idleTimer = setTimeout(proactiveMessage, IDLE_MS);
}
function resetIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}
function proactiveMessage() {
  if (idleCount >= 2) return;
  idleCount++;
  var box = document.getElementById('chat-box');
  var typing = document.getElementById('typing');
  typing.style.display = 'flex';
  box.scrollTop = box.scrollHeight;
  setTimeout(function () {
    typing.style.display = 'none';
    var msgs = [
      ['……在忙吗？', '半天没回我。'],
      ['喂，', '我查房都查完一轮了，', '你还没冒泡。'],
      ['（看了眼手机）', '行吧，', '你忙你的，我等你。']
    ];
    streamReplies(msgs[idleCount - 1]);
    box.scrollTop = box.scrollHeight;
  }, 1200);
  // 防冷落也加一点好感度
  intimacy = Math.min(100, intimacy + 1);
  updateIntimacyDisplay();
  resetIdleTimer();
  idleTimer = setTimeout(proactiveMessage, IDLE_MS * 2);
}
startIdleTimer();

// ===== 语音模拟 =====
function toggleVoice() {
  var v = document.getElementById('voice-ind');
  var btn = document.getElementById('mic-btn');
  if (v.style.display === 'none') {
    v.style.display = 'block';
    btn.textContent = '⏹️';
  } else {
    v.style.display = 'none';
    btn.textContent = '🎙️';
    document.getElementById('chat-text').value = '我今天有点累';
  }
}

// ===== Toast =====
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2000);
}
function goBack() { history.back(); }
