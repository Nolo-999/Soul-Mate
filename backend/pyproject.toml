# ============================================
# SoulMate 后端配置文件
# ============================================

[project]
name = "soulmate-backend"
version = "0.1.0"
description = "SoulMate 可定制化人机恋体验 - 后端服务"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
