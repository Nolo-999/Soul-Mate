# ============================================
# SoulMate 部署 - Docker Compose
# ============================================
# 一键启动：docker compose up -d
# MVP 单台 4C8G 支撑 500-1000 DAU

version: "3.9"

services:
  # ---- MySQL 8 ----
  mysql:
    image: mysql:8.0
    container_name: sm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-soulmate123}
      MYSQL_DATABASE: soulmate
    ports:
      - "3306:3306"
    volumes:
      - sm_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    container_name: sm-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - sm_redis:/data

  # ---- ChromaDB 向量库 ----
  chroma:
    image: chromadb/chroma:latest
    container_name: sm-chroma
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - sm_chroma:/chroma/chroma

  # ---- MinIO 对象存储 ----
  minio:
    image: minio/minio:latest
    container_name: sm-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - sm_minio:/data

  # ---- 后端 FastAPI ----
  backend:
    build: ./backend
    container_name: sm-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - redis
      - chroma
      - minio
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---- Celery Worker ----
  celery:
    build: ./backend
    container_name: sm-celery
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app worker -l info

  # ---- 前端 Vite ----
  frontend:
    build: ./frontend
    container_name: sm-frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  sm_mysql:
  sm_redis:
  sm_chroma:
  sm_minio:
